
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="900"
  viewBox="0 0 600 900"
>

<defs>

  <linearGradient
    id="background"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%"
  >
    <stop
      offset="0%"
      stop-color="#09090b"
    />

    <stop
      offset="100%"
      stop-color="#000000"
    />
  </linearGradient>

  <radialGradient
    id="glow"
    cx="50%"
    cy="35%"
    r="60%"
  >
    <stop
      offset="0%"
      stop-color="#94a3b8"
      stop-opacity="0.22"
    />

    <stop
      offset="100%"
      stop-color="#94a3b8"
      stop-opacity="0"
    />
  </radialGradient>

  <linearGradient
    id="bottomFade"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
  >
    <stop
      offset="0%"
      stop-color="#000000"
      stop-opacity="0"
    />

    <stop
      offset="65%"
      stop-color="#000000"
      stop-opacity="0.15"
    />

    <stop
      offset="100%"
      stop-color="#000000"
      stop-opacity="0.98"
    />
  </linearGradient>

</defs>

<!-- BACKGROUND -->

<rect
  width="600"
  height="900"
  fill="url(#background)"
/>

<rect
  width="600"
  height="900"
  fill="url(#glow)"
/>

<!-- MOVIE-SPECIFIC ART -->


        <rect x="70" y="190"
          width="460"
          height="470"
          fill="#111827"
          stroke="#334155"
          stroke-width="3"/>

        <rect x="110" y="230"
          width="150"
          height="190"
          fill="#020617"/>

        <rect x="340" y="230"
          width="150"
          height="190"
          fill="#020617"/>

        <path
          d="M270 660
             C240 570 250 470 300 430
             C350 470 360 570 330 660Z"
          fill="#020617"
          stroke="#64748b"
          stroke-width="3"
        />

        <circle cx="300" cy="420" r="35"
          fill="#020617"
          stroke="#64748b"
          stroke-width="3"/>

        <path
          d="M90 690 L510 690"
          stroke="#ef4444"
          stroke-width="7"
          stroke-dasharray="30 15"
        />
      

<!-- CINEMATIC DARK FADE -->

<rect
  width="600"
  height="900"
  fill="url(#bottomFade)"
/>

<!-- BRAND -->

<text
  x="42"
  y="62"
  fill="#ffffff"
  font-family="Arial, Helvetica, sans-serif"
  font-size="22"
  font-weight="700"
  letter-spacing="5"
>
CINEBOOK
</text>

<rect
  x="42"
  y="80"
  width="70"
  height="3"
  rx="2"
  fill="#94a3b8"
/>

<!-- TITLE -->

<text
  x="42"
  y="700"
  fill="#ffffff"
  font-family="Arial, Helvetica, sans-serif"
  font-size="42"
  font-weight="800"
>
Silent Witness
</text>

<!-- GENRE -->

<text
  x="42"
  y="742"
  fill="#ffffff"
  opacity="0.78"
  font-family="Arial, Helvetica, sans-serif"
  font-size="15"
  letter-spacing="1.2"
>
Mystery  •  Thriller
</text>

<!-- LANGUAGE -->

<text
  x="42"
  y="772"
  fill="#ffffff"
  opacity="0.65"
  font-family="Arial, Helvetica, sans-serif"
  font-size="15"
>
English
</text>

<!-- CERTIFICATE -->

<rect
  x="42"
  y="800"
  width="58"
  height="30"
  rx="5"
  fill="#ffffff"
  opacity="0.12"
/>

<text
  x="71"
  y="820"
  text-anchor="middle"
  fill="#ffffff"
  font-family="Arial, Helvetica, sans-serif"
  font-size="12"
  font-weight="700"
>
U/A
</text>

<!-- PLAY ICON -->

<circle
  cx="525"
  cy="815"
  r="32"
  fill="none"
  stroke="#94a3b8"
  stroke-width="2"
  opacity="0.8"
/>

<path
  d="M516 800 L540 815 L516 830 Z"
  fill="#94a3b8"
/>

<!-- FOOTER -->

<text
  x="558"
  y="865"
  text-anchor="end"
  fill="#ffffff"
  opacity="0.45"
  font-family="Arial, Helvetica, sans-serif"
  font-size="10"
  letter-spacing="2"
>
CINEMATIC EXPERIENCE
</text>

</svg>
