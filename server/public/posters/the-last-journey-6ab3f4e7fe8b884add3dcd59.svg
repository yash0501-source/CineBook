
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="900"
  viewBox="0 0 600 900"
>

<defs>

  <linearGradient
    id="background"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%"
  >
    <stop
      offset="0%"
      stop-color="#301b0b"
    />

    <stop
      offset="100%"
      stop-color="#000000"
    />
  </linearGradient>

  <radialGradient
    id="glow"
    cx="50%"
    cy="35%"
    r="60%"
  >
    <stop
      offset="0%"
      stop-color="#fbbf24"
      stop-opacity="0.22"
    />

    <stop
      offset="100%"
      stop-color="#fbbf24"
      stop-opacity="0"
    />
  </radialGradient>

  <linearGradient
    id="bottomFade"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
  >
    <stop
      offset="0%"
      stop-color="#000000"
      stop-opacity="0"
    />

    <stop
      offset="65%"
      stop-color="#000000"
      stop-opacity="0.15"
    />

    <stop
      offset="100%"
      stop-color="#000000"
      stop-opacity="0.98"
    />
  </linearGradient>

</defs>

<!-- BACKGROUND -->

<rect
  width="600"
  height="900"
  fill="url(#background)"
/>

<rect
  width="600"
  height="900"
  fill="url(#glow)"
/>

<!-- MOVIE-SPECIFIC ART -->


        <circle cx="440" cy="210" r="115"
          fill="#fef3c7" opacity="0.9"/>

        <path
          d="M0 570 L170 430 L260 510 L350 390 L600 560 L600 900 L0 900Z"
          fill="#171717"
        />

        <path
          d="M270 900 L320 560 L370 560 L430 900Z"
          fill="#292524"
        />

        <path
          d="M295 900 L340 590 L385 900"
          fill="none"
          stroke="#fbbf24"
          stroke-width="5"
          stroke-dasharray="28 24"
        />

        <circle cx="340" cy="535" r="12"
          fill="#fbbf24"/>

        <path
          d="M340 550 L340 610"
          stroke="#fbbf24"
          stroke-width="8"
        />
      

<!-- CINEMATIC DARK FADE -->

<rect
  width="600"
  height="900"
  fill="url(#bottomFade)"
/>

<!-- BRAND -->

<text
  x="42"
  y="62"
  fill="#ffffff"
  font-family="Arial, Helvetica, sans-serif"
  font-size="22"
  font-weight="700"
  letter-spacing="5"
>
CINEBOOK
</text>

<rect
  x="42"
  y="80"
  width="70"
  height="3"
  rx="2"
  fill="#fbbf24"
/>

<!-- TITLE -->

<text
  x="42"
  y="700"
  fill="#ffffff"
  font-family="Arial, Helvetica, sans-serif"
  font-size="42"
  font-weight="800"
>
The Last Journey
</text>

<!-- GENRE -->

<text
  x="42"
  y="742"
  fill="#ffffff"
  opacity="0.78"
  font-family="Arial, Helvetica, sans-serif"
  font-size="15"
  letter-spacing="1.2"
>
Adventure  •  Drama
</text>

<!-- LANGUAGE -->

<text
  x="42"
  y="772"
  fill="#ffffff"
  opacity="0.65"
  font-family="Arial, Helvetica, sans-serif"
  font-size="15"
>
English
</text>

<!-- CERTIFICATE -->

<rect
  x="42"
  y="800"
  width="58"
  height="30"
  rx="5"
  fill="#ffffff"
  opacity="0.12"
/>

<text
  x="71"
  y="820"
  text-anchor="middle"
  fill="#ffffff"
  font-family="Arial, Helvetica, sans-serif"
  font-size="12"
  font-weight="700"
>
U/A
</text>

<!-- PLAY ICON -->

<circle
  cx="525"
  cy="815"
  r="32"
  fill="none"
  stroke="#fbbf24"
  stroke-width="2"
  opacity="0.8"
/>

<path
  d="M516 800 L540 815 L516 830 Z"
  fill="#fbbf24"
/>

<!-- FOOTER -->

<text
  x="558"
  y="865"
  text-anchor="end"
  fill="#ffffff"
  opacity="0.45"
  font-family="Arial, Helvetica, sans-serif"
  font-size="10"
  letter-spacing="2"
>
CINEMATIC EXPERIENCE
</text>

</svg>
